name: Release MoviePlay Companion

on:
  push:
    tags:
      - 'movieplay-companion/v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: companions/movieplay-companion
        run: npm install

      - name: Build Companion Binary
        working-directory: companions/movieplay-companion
        shell: cmd
        run: build.bat

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: companions/movieplay-companion/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
